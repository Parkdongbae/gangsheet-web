appId: com.dtfgangsheet.studio
productName: DTF GangSheet Studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,web/tsconfig.json,tsconfig.web.tsbuildinfo}'
  # 웹 SPA(web/)·배포 설정·빌드 로그 — 데스크톱 번들 무관 (asar 혼입 시 아카이브 손상)
  - '!web/**'
  - '!{vercel.json,build-win.log,smoke-stdout.log,smoke-stderr.log}'
  # 사이드카 소스/가상환경 — extraResources 번들 exe로만 배포 (S7)
  - '!export-sidecar/**'
  # 루트 목업(components/)·에이전트 문서·요약 — 앱 번들 무관
  - '!components/**'
  - '!{.agent,.codegraph,.devcontainer,.omo,.playwright-mcp,.ruff_cache}/**'
  - '!{summary.md,.claudeignore,.clineignore,.editorconfig,.gitignore,.prettierignore}'
asarUnpack:
  - 'resources/**'
# PyInstaller onefile 사이드카 → resources/dtf-sidecar/dtf-sidecar.exe
# (src/main/ipc/export.ts 패키지 분기와 경로 계약 — to는 파일 전체 경로)
extraResources:
  - from: export-sidecar/dist/dtf-sidecar.exe
    to: dtf-sidecar/dtf-sidecar.exe
  # 배경 제거 기본 모델 가중치(약 170MB) — 런타임 U2NET_HOME=<resources>/models
  # (export.ts). rembg가 <home>/<model>.onnx 플랫 레이아웃으로 조회한다.
  # 파일은 scripts/fetch-models.ps1로 사전 확보(없으면 이 디렉터리는 빈 채 번들됨).
  - from: resources/models
    to: models
  # 속성 패널 "포토샵 클라우드 가이드" 버튼용 PDF — 리소스 루트에 배치, openPath로 열림
  - from: resources/photoshop_cloud_guide.pdf
    to: photoshop_cloud_guide.pdf
  # 속성 패널 푸터 "사용자 메뉴얼" 버튼용 PDF — 동일 경로 계약
  - from: resources/DTF_사용자_메뉴얼.pdf
    to: DTF_사용자_메뉴얼.pdf
  # 오픈소스 라이선스 고지(MIT/Apache/BSD 등 전문) — 설치 폴더 배치 + 앱 내 열기
  - from: resources/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  # 배경 제거 사이트 다이얼로그 "Adobe Express 배경 제거 가이드" 버튼용 PDF
  - from: resources/adobe_express_background_removal_guide.pdf
    to: adobe_express_background_removal_guide.pdf
win:
  executableName: DTFGangSheetStudio
  icon: build/icon.ico
  target:
    - nsis
    # 단독 실행 파일(설치 불필요) — 자동 압축해제 후 실행되는 portable exe
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-portable.${ext}
npmRebuild: false
